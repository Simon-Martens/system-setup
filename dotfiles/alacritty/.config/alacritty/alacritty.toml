general.import = ["~/.config/system-setup/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
size = 12

[window]
padding.x = 12
padding.y = 8
decorations = "None"
opacity = 1.0
title = "Terminal"

[scrolling]
history = 100000

[cursor.style]
shape = "Beam"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"

[cursor]
blink_interval = 501
unfocused_hollow = true

[colors.line_indicator]
foreground = "#ffffff"
background = "#333333"

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Space", mods = "Control", mode = "Vi", action = "ScrollToBottom" },
  { key = "Space", mods = "Control", action = "ToggleViMode" },
]

[mouse]
hide_when_typing = true

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
