################
### MONITORS ###
################

# exec-once = hypridle & # Lid close lock
# exec-once = iio-hyprland & # Auto turn screen

# See https://wiki.hyprland.org/Configuring/Monitors/
env = GDK_SCALE,1
monitor = eDP-1,highres@highrr,0x0,1
misc:vfr = true

workspace = 1, monitor:eDP-1, default:true

# these settings are for energy savings
decoration:blur:enabled = false


general {
    gaps_in = 6
    gaps_out = 6
		border_size = 1

		layout = scrolling
}

# Debug startup behavior for thet app window on laptop
windowrule {
    name = thet-debug
    match:class = thet
    no_initial_focus = true
    workspace = 3
    float = true
    size = (monitor_w*0.72) (monitor_h*0.78)
}

# Debug startup behavior for thet app window on laptop
windowrule {
    name = com.example.my_proj
    match:class = com.example.my_proj
    no_initial_focus = true
    workspace = 3
    float = true
    size = (monitor_w*0.72) (monitor_h*0.78)
}
