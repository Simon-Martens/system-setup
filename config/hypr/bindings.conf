###################### Gestures
# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
		workspace_swipe_min_speed_to_force = 20
		workspace_swipe_distance = 200
		workspace_swipe_create_new = true
		workspace_swipe_invert = false
		gesture = 4, vertical, workspace,
		gesture = 3, vertical, workspace,
}

binds {
	# In case someone ends up[ on the minimized workspace
	hide_special_on_workspace_change = true

}

######################## Utilities
# Launching
bind = $mainMod, space, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t
bind = $mainMod, W, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --windows
bind = $mainMod SHIFT, W, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --workspaces
bind = $mainMod, R, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --actions
bind = $mainMod, T, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --tmux
bind = $mainMod SHIFT, K, exec, uwsm app --  ~/.local/share/system-setup/bin/system-setup-show-keybindings

# Aesthetics
bind = $mainMod SHIFT, SPACE, exec, uwsm app -- pkill -SIGUSR1 waybar
bind = $mainMod CTRL, SPACE, exec, uwsm app -- ~/.local/share/system-setup/bin/swaybg-next

# Menus
bind = $mainMod SHIFT CTRL, SPACE, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --themes
bind = $mainMod, G, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --governor
bind = $mainMod, ESCAPE, exec, uwsm app -- ~/.local/share/system-setup/bin/tlauncher -t --power

# Notifications
bind = $mainMod, comma, exec, uwsm app -- makoctl dismiss

# Toggle idling
bind = $mainMod CTRL, I, exec, uwsm app -- ~/.local/share/system-setup/bin/system-setup-toggle-idle


# Screenshots
bind = , PRINT, exec, uwsm app -- hyprshot -m region --clipboard-only
bind = SHIFT, PRINT, exec, uwsm app -- hyprshot -m window
bind = CTRL, PRINT, exec, uwsm app -- hyprshot -m output
bind = SUPER, HOME, exec, uwsm app -- hyprshot -m region
bind = SUPER SHIFT, HOME, exec, uwsm app -- hyprshot -m window
bind = SUPER CTRL, HOME, exec, uwsm app -- hyprshot -m output

######################## Hyprland Window Mgmt
# Minimize
bind = $mainMod, M, exec, uwsm app -- ~/.local/share/system-setup/bin/hyprland-minimizer

# Fullscreen
bind = $mainMod, F, fullscreen
# Close window
bind = $mainMod, C, killactive,

# Control tiling
bind = $mainMod, S, togglesplit, # dwindle
# bind = $mainMod, P, pseudo, # idk, who needs that anyway
bind = $mainMod, V, togglefloating,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Swap active window with the one next to it with mainMod + SHIFT + arrow keys
bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d
bind = $mainMod CTRL, H, swapwindow, l
bind = $mainMod CTRL, L, swapwindow, r
bind = $mainMod CTRL, K, swapwindow, u
bind = $mainMod CTRL, J, swapwindow, d 

# Swap the contents of workspaces
bind = $mainMod CTRL SHIFT, left, exec, hyprctl dispatch swapactiveworkspaces l 0 && hyprctl dispatch focuswindow l
bind = $mainMod CTRL SHIFT, right, exec, hyprctl dispatch swapactiveworkspaces r 0 && hyprctl dispatch focuswindow r
bind = $mainMod CTRL SHIFT, up, exec, hyprctl dispatch swapactiveworkspaces u 0 && hyprctl dispatch focuswindow u
bind = $mainMod CTRL SHIFT, down, exec, hyprctl dispatch swapactiveworkspaces d 0 && hyprctl dispatch focuswindow d
bind = $mainMod CTRL SHIFT, H, exec, hyprctl dispatch swapactiveworkspaces current l && hyprctl dispatch focusmonitor l
bind = $mainMod CTRL SHIFT, L, exec, hyprctl dispatch swapactiveworkspaces current r && hyprctl dispatch focusmonitor r
bind = $mainMod CTRL SHIFT, J, exec, hyprctl dispatch swapactiveworkspaces current d && hyprctl dispatch focusmonitor d
bind = $mainMod CTRL SHIFT, K, exec, hyprctl dispatch swapactiveworkspaces current u && hyprctl dispatch focusmonitor u

# Resize active window
bind = $mainMod, minus, resizeactive, -100 0
bind = $mainMod, equal, resizeactive, 100 0
bind = $mainMod SHIFT, minus, resizeactive, 0 -100
bind = $mainMod SHIFT, equal, resizeactive, 0 100

# Switch to the next/previous workspace (relative to active monitor)
bind = $mainMod, X, workspace, r+1
bind = $mainMod, Z, workspace, r-1

# Move active window to the next/previous workspace (relative to active monitor)
bind = $mainMod SHIFT, X, movetoworkspace, r+1
bind = $mainMod SHIFT, Z, movetoworkspace, r-1
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r

bind = ALT, TAB, cyclenext, visible hist
bind = $mainMod, TAB, exec, ~/.local/share/system-setup/bin/tlauncher -t --windows

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


######################## Media Keys
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 2.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

