###################### Gestures
# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
		workspace_swipe_min_speed_to_force = 20
		workspace_swipe_distance = 200
		workspace_swipe_create_new = true
		workspace_swipe_invert = false
		gesture = 4, vertical, workspace,
		gesture = 3, vertical, workspace,
}

binds {
	# In case someone ends up[ on the minimized workspace
	hide_special_on_workspace_change = true

}

######################## DankShell Integration
# Application Launchers
bind = SUPER, Space, exec, dms ipc call spotlight toggle
bind = SUPER, V, exec, dms ipc call clipboard toggle
bind = SUPER, M, exec, dms ipc call processlist focusOrToggle
bind = SUPER, Comma, exec, dms ipc call settings focusOrToggle
bind = SUPER, Y, exec, dms ipc call dankdash wallpaper
bind = SUPER, N, exec, dms ipc call notifications toggle
bind = SUPER SHIFT, N, exec, dms ipc call notepad toggle

# System Controls
bind = SUPER ALT, L, exec, dms ipc call lock lock
bind = SUPER SHIFT, E, exec, uwsm stop
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle

# Screenshots via DankShell
bind = , Print, exec, dms ipc call screenshot capture
bind = CTRL, Print, exec, dms ipc call screenshot captureScreen
bind = ALT, Print, exec, dms ipc call screenshot captureWindow

######################## Utilities
# Launching
bind = SUPER, return, exec, $terminal
bind = SUPER, E, exec, nautilus --new-window
bind = SUPER, B, exec, $browser
bind = SUPER SHIFT, T, exec, $terminal -e btop

# Menus

# Notifications

# Toggle idling

######################## Hyprland Window Mgmt
# Minimize
bind = $mainMod, M, exec, uwsm app -- ~/.local/share/system-setup/bin/hyprland-minimizer

# Close window
bind = $mainMod, C, killactive,
bind = $mainMod, Q, killactive,

# Control tiling
bind = $mainMod, F, fullscreen
bind = $mainMod, S, togglesplit, # dwindle
bind = $mainMod, V, togglefloating,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 10, workspace, 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 10, movetoworkspace, 10

# Swap active window with the one next to it with mainMod + SHIFT + arrow keys
bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d
bind = $mainMod CTRL, H, swapwindow, l
bind = $mainMod CTRL, L, swapwindow, r
bind = $mainMod CTRL, K, swapwindow, u
bind = $mainMod CTRL, J, swapwindow, d 

# Swap the contents of workspaces
bind = $mainMod CTRL SHIFT, left, exec, hyprctl dispatch swapactiveworkspaces l 0 && hyprctl dispatch focuswindow l
bind = $mainMod CTRL SHIFT, right, exec, hyprctl dispatch swapactiveworkspaces r 0 && hyprctl dispatch focuswindow r
bind = $mainMod CTRL SHIFT, up, exec, hyprctl dispatch swapactiveworkspaces u 0 && hyprctl dispatch focuswindow u
bind = $mainMod CTRL SHIFT, down, exec, hyprctl dispatch swapactiveworkspaces d 0 && hyprctl dispatch focuswindow d
bind = $mainMod CTRL SHIFT, H, exec, hyprctl dispatch swapactiveworkspaces current l && hyprctl dispatch focusmonitor l
bind = $mainMod CTRL SHIFT, L, exec, hyprctl dispatch swapactiveworkspaces current r && hyprctl dispatch focusmonitor r
bind = $mainMod CTRL SHIFT, J, exec, hyprctl dispatch swapactiveworkspaces current d && hyprctl dispatch focusmonitor d
bind = $mainMod CTRL SHIFT, K, exec, hyprctl dispatch swapactiveworkspaces current u && hyprctl dispatch focusmonitor u

# Resize active window
bind = $mainMod, minus, resizeactive, -100 0
bind = $mainMod, equal, resizeactive, 100 0
bind = $mainMod SHIFT, minus, resizeactive, 0 -100
bind = $mainMod SHIFT, equal, resizeactive, 0 100

# Switch to the next/previous workspace (relative to active monitor)
bind = $mainMod, X, workspace, r+1
bind = $mainMod, Z, workspace, r-1

# Move active window to the next/previous workspace (relative to active monitor)
bind = $mainMod SHIFT, X, movetoworkspace, r+1
bind = $mainMod SHIFT, Z, movetoworkspace, r-1
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r

bind = ALT, TAB, cyclenext, visible hist

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


######################## Media Keys (via DankShell)
# Audio controls
bindel = ,XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = ,XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindel = ,XF86AudioMute, exec, dms ipc call audio mute
bindel = ,XF86AudioMicMute, exec, dms ipc call audio micmute

# Brightness controls
bindel = ,XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = ,XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# Media player controls
bindl = ,XF86AudioNext, exec, dms ipc call mpris next
bindl = ,XF86AudioPause, exec, dms ipc call mpris playPause
bindl = ,XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = ,XF86AudioPrev, exec, dms ipc call mpris previous

