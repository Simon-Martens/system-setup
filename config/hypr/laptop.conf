################
### MONITORS ###
################

# exec-once = hypridle & # Lid close lock
# exec-once = iio-hyprland & # Auto turn screen

# See https://wiki.hyprland.org/Configuring/Monitors/
env = GDK_SCALE,1
monitor = eDP-1,highres@highrr,0x0,1
misc:vfr = true

# these settings are for energy savings
decoration:blur:enabled = false


general {
    gaps_in = 6
    gaps_out = 6
		border_size = 1

		layout = scrolling
}

plugin {
    hyprscrolling {
        column_width = 0.9
        fullscreen_on_one_column = true
				focus_fit_method = 1
				explicit_column_widths = 0.35, 0.5, 0.65, 0.85, 0.95
    }
}


# gestures {
# 		gesture = 4, right, layoutmsg, move +col
# 		gesture = 3, right, layoutmsg, move +col
# }
#


bind = $mainMod, right, layoutmsg, move +col
bind = $mainMod, left, layoutmsg, move +col
bind = $mainMod CTRL, period, layoutmsg, move +col
bind = $mainMod CTRL, comma, layoutmsg, move -col
bind = $mainMod CTRL SHIFT, period, layoutmsg, movewindowto r
bind = $mainMod CTRL SHIFT, comma, layoutmsg, movewindowto l
bind = $mainMod CTRL, up, layoutmsg, movewindowto u
bind = $mainMod CTRL, down, layoutmsg, movewindowto d
bind = $mainMod CTRL, f, layoutmsg, colresize 1.0
bind = $mainMod CTRL, g, layoutmsg, colresize 0.5
bind = $mainMod CTRL, m, layoutmsg, colresize +0.1
bind = $mainMod CTRL, n, layoutmsg, colresize -0.1
