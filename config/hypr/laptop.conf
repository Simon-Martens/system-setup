################
### MONITORS ###
################

# exec-once = hypridle & # Lid close lock
# exec-once = iio-hyprland & # Auto turn screen

# See https://wiki.hyprland.org/Configuring/Monitors/
env = GDK_SCALE,1
monitor = eDP-1,highres@highrr,0x0,1
misc:vfr = true

# these settings are for energy savings
decoration:blur:enabled = false


general {
    gaps_in = 6
    gaps_out = 6
		border_size = 1

		layout = scrolling
}

plugin {
    hyprscrolling {
        column_width = 0.5
        fullscreen_on_one_column = true
				focus_fit_method = 1
    }
}


# gestures {
# 		gesture = 4, right, layoutmsg, move +col
# 		gesture = 3, right, layoutmsg, move +col
# }
#

bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod SHIFT, period, layoutmsg, movewindowto r
bind = $mainMod SHIFT, comma, layoutmsg, movewindowto l
bind = $mainMod SHIFT, up, layoutmsg, movewindowto u
bind = $mainMod SHIFT, down, layoutmsg, movewindowto d
bind = $mainMod SHIFT, f, layoutmsg, colresize 1.0
bind = $mainMod SHIFT, g, layoutmsg, colresize 0.5
bind = $mainMod SHIFT, v, layoutmsg, colresize 0.666666
bind = $mainMod SHIFT, n, layoutmsg, colresize 0.333333
bind = $mainMod SHIFT, m, layoutmsg, colresize 0.9
