# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Hyprland v0.53+ uses new windowrule syntax

# === Firefox ===
windowrule {
    name = firefox-main
    match:class = ^(firefox)$
    workspace = 2
    maximize = on
}

windowrule {
    name = firefox-pip
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
}

# === Floating Apps ===
# Calculator
windowrule {
    name = calculator
    match:class = ^(org.gnome.Calculator|galculator)$
    float = on
}

# Bluetooth manager
windowrule {
    name = blueman
    match:class = ^(blueman-manager)$
    float = on
}

# Steam
windowrule {
    name = steam
    match:class = ^(steam|steamwebhelper)$
    float = on
}

# xdg-desktop-portal dialogs
windowrule {
    name = portal-gtk
    match:class = ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde)$
    float = on
}

# === DankMaterialShell (DMS) ===
windowrule {
    name = dms-quickshell
    match:class = ^(org.quickshell)$
    float = on
}

# === GNOME apps ===
windowrule {
    name = gnome-settings
    match:class = ^(gnome-control-center|pavucontrol|nm-connection-editor)$
    float = on
}

# === File pickers ===
windowrule {
    name = file-picker
    match:class = ^(xdg-desktop-portal-gtk)$
    match:title = ^(Open|Save|Select)
    float = on
    center = on
}

# === Zoom ===
windowrule {
    name = zoom
    match:class = ^(zoom)$
    float = on
}

# === XWayland fix ===
windowrule {
    name = xwayland-fix
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:floating = 1
    match:fullscreen = 0
    match:pinned = 0
    nofocus = on
}

# === Suppress maximize events ===
windowrule {
    name = suppress-maximize
    match:class = .*
    suppressevent = maximize
}
