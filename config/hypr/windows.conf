# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Hyprland v0.46+ uses windowrulev2 syntax

# === Firefox ===
# Assign to workspace 2 and open maximized
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = maximize, class:^(firefox)$

# Picture-in-Picture floating
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = pin, class:^(firefox)$, title:^(Picture-in-Picture)$

# === Floating Apps ===
# Calculator
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(galculator)$

# Bluetooth manager
windowrulev2 = float, class:^(blueman-manager)$

# Steam
windowrulev2 = float, class:^(steam)$
windowrulev2 = float, class:^(steamwebhelper)$

# xdg-desktop-portal dialogs
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(xdg-desktop-portal-kde)$

# === DankMaterialShell (DMS) ===
# Keep DMS windows floating
windowrulev2 = float, class:^(org.quickshell)$

# === GNOME apps ===
# Settings and control panels
windowrulev2 = float, class:^(gnome-control-center)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$

# === System dialogs ===
# File pickers
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$, title:^(Open|Save|Select)
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$, title:^(Open|Save|Select)

# === Zoom ===
windowrulev2 = float, class:^(zoom)$

# === Fix XWayland issues ===
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# === Suppress maximize events ===
windowrulev2 = suppressevent maximize, class:.*
