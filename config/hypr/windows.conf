# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# === Firefox PiP ===
windowrule {
    name = firefox-pip
    match:class = firefox
    match:title = Picture-in-Picture
    float = true
    pin = true
}

# === Floating Apps ===
windowrule {
    name = calculator
    match:class = org.gnome.Calculator
    float = true
}

windowrule {
    name = galculator
    match:class = galculator
    float = true
}

windowrule {
    name = blueman
    match:class = blueman-manager
    float = true
}

windowrule {
    name = steam
    match:class = steam
    float = true
}

windowrule {
    name = steam-helper
    match:class = steamwebhelper
    float = true
}

# xdg-desktop-portal dialogs
windowrule {
    name = portal-gtk
    match:class = xdg-desktop-portal-gtk
    float = true
}

# === GNOME apps ===
windowrule {
    name = gnome-settings
    match:class = gnome-control-center
    float = true
}

windowrule {
    name = pavucontrol
    match:class = pavucontrol
    float = true
}

windowrule {
    name = nm-editor
    match:class = nm-connection-editor
    float = true
}

# === Zoom ===
windowrule {
    name = zoom
    match:class = zoom
    float = true
}

# === Suppress maximize events ===
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}
