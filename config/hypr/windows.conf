# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Hyprland v0.53+ windowrule syntax

# === Firefox ===
windowrule {
    name = firefox-main
    match:class = firefox$
    workspace = 2
    maximize = true
}

windowrule {
    name = firefox-pip
    match:class = firefox$
    match:title = ^Picture-in-Picture$
    float = true
    pin = true
}

# === Floating Apps ===
windowrule {
    name = calculator
    match:class = org.gnome.Calculator
    float = true
}

windowrule {
    name = galculator
    match:class = galculator
    float = true
}

windowrule {
    name = blueman
    match:class = blueman-manager
    float = true
}

windowrule {
    name = steam
    match:class = steam
    float = true
}

windowrule {
    name = steam-helper
    match:class = steamwebhelper
    float = true
}

# xdg-desktop-portal dialogs
windowrule {
    name = portal-gtk
    match:class = xdg-desktop-portal-gtk
    float = true
}

windowrule {
    name = portal-kde
    match:class = xdg-desktop-portal-kde
    float = true
}

# === DankMaterialShell (DMS) ===
windowrule {
    name = dms-quickshell
    match:class = org.quickshell
    float = true
}

# === GNOME apps ===
windowrule {
    name = gnome-settings
    match:class = gnome-control-center
    float = true
}

windowrule {
    name = pavucontrol
    match:class = pavucontrol
    float = true
}

windowrule {
    name = nm-editor
    match:class = nm-connection-editor
    float = true
}

# === File pickers ===
windowrule {
    name = file-picker-open
    match:class = xdg-desktop-portal-gtk
    match:title = ^Open
    float = true
    center = true
}

windowrule {
    name = file-picker-save
    match:class = xdg-desktop-portal-gtk
    match:title = ^Save
    float = true
    center = true
}

windowrule {
    name = file-picker-select
    match:class = xdg-desktop-portal-gtk
    match:title = ^Select
    float = true
    center = true
}

# === Zoom ===
windowrule {
    name = zoom
    match:class = zoom
    float = true
}

# === XWayland fix ===
windowrule {
    name = xwayland-fix
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# === Suppress maximize events ===
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}
