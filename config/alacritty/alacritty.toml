general.import = ["~/.config/system-setup/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "MonaspiceRn Nerd Font", style = "Medium" }
size = 14

[window]
padding.x = 3
padding.y = 4
decorations = "None"
opacity = 1.0
title = "Terminal"

[scrolling]
history = 100000

[cursor]
style = "Beam"
blink_interval = 501
unfocused_hollow = true

[keyboard]
bindings = [{ key = "F11", action = "ToggleFullscreen" }]
