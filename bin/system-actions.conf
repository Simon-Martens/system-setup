# System Actions Configuration
# Format: action_name:command:description
power:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-power-menu:Show power menu
lock:hyprctl dispatch exec hyprlock:Lock the current session
suspend:systemctl suspend:Suspend the system
relaunch:hyprctl dispatch exit:Restart Hyprland window manager
restart:systemctl reboot:Restart the system
shutdown:systemctl poweroff:Shut down the system
governor:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-governor-menu:Switch CPU governor settings
theme:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-theme-menu:Change system theme
tmux:hyprctl dispatch exec "~/.local/share/omarchy/bin/omarchy-launcher-terminal --tmux":Control tmux sessions
mixer:hyprctl dispatch exec "alacritty --class wiremix -e bash -c 'sleep 0.2; wiremix'":Open audio mixer
audio:hyprctl dispatch exec "alacritty --class wiremix -e bash -c 'sleep 0.2; wiremix'":Open audio mixer
audio output:hyprctl dispatch exec "alacritty --class wiremix -e bash -c 'sleep 0.2; wiremix -v output'":Open audio output panel
audio input:hyprctl dispatch exec "alacritty --class wiremix -e bash -c 'sleep 0.2; wiremix -v input'":Open audio input panel
network:hyprctl dispatch exec "alacritty --class nmtui -e bash -c 'sleep 0.5; nmtui'":Control network connections
wifi:hyprctl dispatch exec "alacritty --class nmtui -e bash -c 'sleep 0.5; nmtui'":Control WiFi connections
ethernet:hyprctl dispatch exec "alacritty --class nmtui -e bash -c 'sleep 0.5; nmtui'":Control ethernet connections
bluetooth:hyprctl dispatch exec "alacritty --class bluetui -e bash -c 'sleep 0.5; bluetui'":Control bluetooth devices
minimize:hyprctl dispatch exec ~/.local/share/omarchy/bin/hyprland-minimizer:Minimize current window
restore:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-show-minimized-fzf-terminal:Show minimized windows
kill:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-close-window:Close current window
float:hyprctl dispatch togglefloating:Toggle floating window
fullscreen:hyprctl dispatch fullscreen:Toggle fullscreen
next workspace:hyprctl dispatch workspace r+1:Switch to next workspace
prev workspace:hyprctl dispatch workspace r-1:Switch to previous workspace
screenshot region:hyprctl dispatch exec "hyprshot -m region":Take region screenshot
screenshot window:hyprctl dispatch exec "hyprshot -m window":Take window screenshot  
screenshot output:hyprctl dispatch exec "hyprshot -m output":Take output screenshot
dismiss notification:hyprctl dispatch exec "makoctl dismiss":Dismiss notification
dismiss all notifications:hyprctl dispatch exec "makoctl dismiss --all":Dismiss all notifications
toggle dnd:hyprctl dispatch exec "makoctl mode -t do-not-disturb":Toggle do not disturb
toggle idle:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-toggle-idle:Toggle idle timeout
keybindings:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-show-keybindings:Show keybindings
next wallpaper:hyprctl dispatch exec ~/.local/share/omarchy/bin/swaybg-next:Change wallpaper
reload waybar:hyprctl dispatch exec "pkill -SIGUSR1 waybar":Reload waybar
close:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-close-window:Close current window
min:hyprctl dispatch exec ~/.local/share/omarchy/bin/hyprland-minimizer:Minimize current window
ws next:hyprctl dispatch workspace r+1:Switch to next workspace
ws prev:hyprctl dispatch workspace r-1:Switch to previous workspace
ws 1:hyprctl dispatch workspace 1:Switch to workspace 1
ws 2:hyprctl dispatch workspace 2:Switch to workspace 2
ws 3:hyprctl dispatch workspace 3:Switch to workspace 3
ws 4:hyprctl dispatch workspace 4:Switch to workspace 4
ws 5:hyprctl dispatch workspace 5:Switch to workspace 5
ws 6:hyprctl dispatch workspace 5:Switch to workspace 6
screenshot:hyprctl dispatch exec "hyprshot -m region":Take region screenshot
notify:hyprctl dispatch exec "makoctl dismiss":Dismiss notification
dnd:hyprctl dispatch exec "makoctl mode -t do-not-disturb":Toggle do not disturb
wallpaper:hyprctl dispatch exec ~/.local/share/omarchy/bin/swaybg-next:Change wallpaper

# Omarchy System Management
update omarchy:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-update:Update omarchy system and packages
refresh waybar:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-refresh-waybar:Reset Waybar to omarchy defaults
sync apps:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-sync-applications:Sync application entries and icons
config link:hyprctl dispatch exec ~/.local/share/omarchy/bin/omarchy-config-link:Link omarchy configs for testing
relaunch waybar:hyprctl dispatch exec ~/.local/share/omarchy/bin/waybar-relaunch:Restart Waybar

# Applications from hyprland.conf
terminal:hyprctl dispatch exec alacritty:Open terminal
file manager:hyprctl dispatch exec "nautilus --new-window":Open file manager
browser:hyprctl dispatch exec firefox:Open Firefox browser
notes:hyprctl dispatch exec "alacritty --class notes -e ~/.local/share/omarchy/bin/notes":Open notes in terminal
system monitor:hyprctl dispatch exec "alacritty -e btop":Open system monitor
claude folder:hyprctl dispatch exec ~/.local/share/omarchy/bin/claude-folder-chooser:Choose folder for Claude

# Utilities
brightness down:hyprctl dispatch exec "~/.local/share/omarchy/bin/apple-display-brightness -5000":Decrease display brightness
brightness up:hyprctl dispatch exec "~/.local/share/omarchy/bin/apple-display-brightness +5000":Increase display brightness
brightness max:hyprctl dispatch exec "~/.local/share/omarchy/bin/apple-display-brightness +60000":Set maximum brightness

# Quick workspace shortcuts  
move to ws 1:~/.local/share/omarchy/bin/omarchy-window-action movetoworkspace 1:Move window to workspace 1
move to ws 2:~/.local/share/omarchy/bin/omarchy-window-action movetoworkspace 2:Move window to workspace 2
move to ws 3:~/.local/share/omarchy/bin/omarchy-window-action movetoworkspace 3:Move window to workspace 3
move to ws 4:~/.local/share/omarchy/bin/omarchy-window-action movetoworkspace 4:Move window to workspace 4
move to ws 5:~/.local/share/omarchy/bin/omarchy-window-action movetoworkspace 5:Move window to workspace 5
move to ws 6:~/.local/share/omarchy/bin/omarchy-window-action movetoworkspace 6:Move window to workspace 6

# Window management shortcuts
center window:~/.local/share/omarchy/bin/omarchy-window-action centerwindow:Center floating window
pin window:~/.local/share/omarchy/bin/omarchy-window-action pin:Pin window to all workspaces
toggle float:~/.local/share/omarchy/bin/omarchy-window-action togglefloating:Toggle floating window
pseudo tile:~/.local/share/omarchy/bin/omarchy-window-action pseudo:Toggle pseudo tiling
fullscreen:~/.local/share/omarchy/bin/omarchy-window-action fullscreen:Toggle fullscreen
